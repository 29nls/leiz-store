# ─────────────────────────────────────────────────────────────
# LEIZ STORE - Docker Compose
#
# Usage:
#   cp .env.example .env        # isi semua secret terlebih dahulu
#   docker compose up -d        # hanya aplikasi (port 3000)
#   docker compose --profile proxy up -d   # aplikasi + reverse proxy Caddy (TLS otomatis)
#
# Secret hanya di-baca dari .env via env_file / ${VAR} —
# TIDAK ada secret yang di-hardcode di file ini atau di image.
# ─────────────────────────────────────────────────────────────

name: leiz-store

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* di-inline ke client bundle saat BUILD time.
      # Hanya variabel public yang di-pass sebagai build-arg.
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
        NEXT_PUBLIC_FB_PIXEL_ID: ${NEXT_PUBLIC_FB_PIXEL_ID:-}
        NEXT_PUBLIC_HOTJAR_ID: ${NEXT_PUBLIC_HOTJAR_ID:-}
        NEXT_PUBLIC_HOTJAR_SV: ${NEXT_PUBLIC_HOTJAR_SV:-}
    image: ${IMAGE_NAME:-ghcr.io/29nls/leiz-store}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 10s
    networks:
      - app-net

  # Reverse proxy opsional dengan TLS otomatis (Let's Encrypt).
  # Aktifkan dengan: docker compose --profile proxy up -d
  proxy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "443:443/udp" # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    depends_on:
      web:
        condition: service_healthy
    networks:
      - app-net

volumes:
  caddy-data:
  caddy-config:

networks:
  app-net:
    driver: bridge
